<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODIT</title>
  <meta name="description" content="계정도 클라우드도 없이 내 PC에서 돌아가는 Windows 영상 편집기.">
  <meta name="theme-color" content="#131316">
  <meta property="og:title" content="ODIT">
  <meta property="og:description" content="영상 편집의 모든 것, 내 PC에서 가볍게.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/shots/editor.webp">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.classList.add('js')</script>
  <script src="/main.js" defer></script>
  <script src="/download.js" defer></script>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="mark" href="/" aria-label="ODIT 처음으로"><img src="/assets/mark.png" alt="" width="39" height="24"></a>
    <nav class="tabs">
      <a href="/#features">기능</a>
      <a href="/help">도움말</a>
      <a href="/report">버그 제보</a>
      <a href="/download">다운로드</a>
    </nav>
  </div>
</header>

<main>

  <section class="hero">
    <h1 data-anim="focus">영상 편집의 모든 것<br>내 PC에서 가볍게</h1>
    <a class="btn" data-download="latest" href="/download"><i class="fa-brands fa-windows"></i><span>ODIT 받기</span></a>
    <figure class="frame hero-shot reveal">
      <img src="/assets/shots/editor.webp" srcset="/assets/shots/editor-sm.webp 800w, /assets/shots/editor.webp 1600w" sizes="(max-width: 1120px) 100vw, 1080px" alt="ODIT 편집 화면" width="1600" height="980" fetchpriority="high">
    </figure>
  </section>

  <section class="big" id="features">
    <h2 data-anim="drag">끌어다 놓고 자르면<br>그걸로 충분해요</h2>
    <figure class="frame reveal"><img loading="lazy" src="/assets/shots/timeline.webp" srcset="/assets/shots/timeline-sm.webp 800w, /assets/shots/timeline.webp 1600w" sizes="(max-width: 1120px) 100vw, 1080px" alt="타임라인" width="1600" height="980"></figure>
  </section>

  <section class="big">
    <h2 data-anim="curve">움직임은<br>곡선으로 다듬고</h2>
    <figure class="frame reveal"><img loading="lazy" src="/assets/shots/graph.webp" srcset="/assets/shots/graph-sm.webp 800w, /assets/shots/graph.webp 1600w" sizes="(max-width: 1120px) 100vw, 1080px" alt="그래프 에디터" width="1600" height="980"></figure>
  </section>

  <section class="big">
    <h2 data-anim="mold">도형은<br>손으로 빚듯이</h2>
    <figure class="frame reveal"><img loading="lazy" src="/assets/shots/shape.webp" srcset="/assets/shots/shape-sm.webp 800w, /assets/shots/shape.webp 1600w" sizes="(max-width: 1120px) 100vw, 1080px" alt="꼭짓점 편집" width="1600" height="980"></figure>
  </section>

  <section class="big">
    <h2 data-anim="color">색감은<br>한 번에 입히고</h2>
    <figure class="frame reveal"><img loading="lazy" src="/assets/shots/effects.webp" srcset="/assets/shots/effects-sm.webp 800w, /assets/shots/effects.webp 1600w" sizes="(max-width: 1120px) 100vw, 1080px" alt="룩 목록" width="1600" height="980"></figure>
  </section>

  <section class="grid">
    <article class="card reveal">
      <h3 data-anim="eq">소리에 맞춰<br>움직이는 스펙트럼</h3>
      <img loading="lazy" src="/assets/shots/spectrum-sm.webp" alt="오디오 스펙트럼" width="800" height="490">
    </article>
    <article class="card reveal">
      <h3 data-anim="mask">보여줄 곳만<br>남기는 마스크</h3>
      <img loading="lazy" src="/assets/shots/mask-sm.webp" alt="마스크" width="800" height="490">
    </article>
    <article class="card reveal">
      <h3 data-anim="type">글자에도<br>연출을</h3>
      <img loading="lazy" src="/assets/shots/text-sm.webp" alt="텍스트" width="800" height="490">
    </article>
    <article class="card reveal">
      <h3 data-anim="ghost">앞뒤 프레임을<br>겹쳐 보면서</h3>
      <img loading="lazy" src="/assets/shots/onion-sm.webp" alt="양파 스킨" width="800" height="490">
    </article>
    <article class="card reveal">
      <h3 data-anim="calc">값과 값을<br>수식으로 잇고</h3>
      <img loading="lazy" src="/assets/shots/variables-sm.webp" alt="변수" width="800" height="490">
    </article>
    <article class="card reveal">
      <h3 data-anim="zoom">하드웨어 가속으로<br>빠르게 내보내기</h3>
      <img loading="lazy" src="/assets/shots/export.webp" alt="내보내기" width="880" height="440">
    </article>
  </section>

  <section class="plain">
    <h2 data-anim="drop">계정도 클라우드도 없이<br>내 PC에서만</h2>
  </section>

  <section class="end">
    <img class="reveal" src="/assets/logo.svg" alt="" width="88" height="88">
    <h2 data-anim="clap">첫 영상을<br>ODIT로 만들어 보세요</h2>
    <a class="btn" data-download="latest" href="/download"><i class="fa-brands fa-windows"></i><span>ODIT 받기</span></a>
  </section>

</main>

<footer class="foot">
  <span>© 2026 ODIT</span>
  <a href="https://github.com/a2den1/odit-web" rel="noopener">GitHub</a>
</footer>

</body>
</html>
