<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODIT 크레딧</title>
  <meta name="theme-color" content="#131316">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="mark" href="/" aria-label="ODIT 처음으로"><img src="/assets/mark.png" alt="" width="39" height="24"><img class="mark-tg" src="/assets/twelvegames.png" alt="TwelveGames" width="139" height="72"></a>
    <nav class="tabs">
      <a href="/#features">기능</a>
      <a href="/help">도움말</a>
      <a href="/report">버그 제보</a>
      <a href="/download">다운로드</a>
    </nav>
  </div>
</header>

<main class="credits">
  <h1>크레딧</h1>

  <figure class="credit-drawing"><img src="/assets/credits/naming.png" alt="이름 지은 사람 그림" width="800" height="600"></figure>

  <article class="credit-maker">
    <img class="maker-pic" src="/assets/credits/aiden.png" alt="AIDEN" width="512" height="512">
    <div class="maker-text">
      <p class="credit-role">제작</p>
      <h2>AIDEN</h2>
    </div>
    <button class="discord" type="button" data-copy="_a2den.">
      <i class="fa-brands fa-discord"></i><span>_a2den.</span>
    </button>
  </article>
</main>

<footer class="foot">
  <span>© 2026 ODIT</span>
  <a href="/credits" aria-current="page">크레딧</a>
</footer>

<script>
  for (const b of document.querySelectorAll('[data-copy]')) {
    b.addEventListener('click', async () => {
      const label = b.querySelector('span')
      try { await navigator.clipboard.writeText(b.dataset.copy) } catch { return }
      label.textContent = '복사했어요'
      b.classList.add('done')
      setTimeout(() => { label.textContent = b.dataset.copy; b.classList.remove('done') }, 1400)
    })
  }
</script>
</body>
</html>
